# Cross-platform environment for NeedLR (macOS and Linux; also works on Windows).
# The original Windows-only Anaconda export is kept in environment-windows-legacy.yml.
name: NeedLR
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pyqt=5
  - mayavi
  - numpy
  - scipy
  - scikit-learn
  - networkx
  # No matplotlib on purpose: its conda-forge build depends on pyside6 ->
  # qt6-main, which would put Qt6 libs in the env (the app only used it for
  # a colormap; gui/pointcloud_view.py now has a built-in plasma gradient).
  # gui/__init__.py still pins QT_API=pyqt5 as defense in depth.
  - laspy
  - lazrs-python
  - pip
  - pip:
      # Optional: CUDA farthest-point-sampling acceleration. Requires a CUDA
      # toolkit and a CUDA-capable GPU. Without it, NeedLR falls back to the
      # pure-numpy FPS implementations in algorithms/downsampling.py.
      # - fpsample==0.3.1
