# Cross-platform environment for NeedLR (macOS and Linux; also works on Windows).
# The original Windows-only Anaconda export is kept in environment-windows-legacy.yml.
name: NeedLR
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pyqt=5
  - numpy
  - scipy
  - scikit-learn
  - networkx
  - laspy
  - lazrs-python
  - pip
  - pip:
      # VTK and mayavi come from PyPI on purpose: the conda-forge vtk build
      # links Qt6, so importing vtk loads libQt6Core next to libQt5Core and
      # macOS prints objc duplicate-class warnings at launch. The PyPI vtk
      # wheels are built without Qt (verified: no libQt* NEEDED entries, and
      # macosx arm64 + manylinux wheels exist). mayavi pulls pyface, traitsui,
      # traits, apptools and envisage from PyPI as well.
      - vtk==9.7.2
      - mayavi==4.9.0
      # Optional: CUDA farthest-point-sampling acceleration. Requires a CUDA
      # toolkit and a CUDA-capable GPU. Without it, NeedLR falls back to the
      # pure-numpy FPS implementations in algorithms/downsampling.py.
      # - fpsample==0.3.1
